---
layout: default
---
<article class="post">
  <h1 class="page-heading">{{ page.title }}</h1>
  <div class="post-date">{{ page.date | date: "%-d %B %Y" }}</div>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<div class="post-nav">
  <a class="link" href="{{ '/blog/' | relative_url }}">All posts</a>
</div>
