<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}" />
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}" />
  {%- comment -%} An old deep link like /pages/software#prophet keeps its own anchor {%- endcomment -%}
  <script>location.replace(location.hash ? '{{ "/" | relative_url }}' + location.hash : '{{ page.redirect_to | relative_url }}');</script>
</head>
<body>
  <p><a href="{{ page.redirect_to | relative_url }}">This page has moved.</a></p>
</body>
</html>
